name: 毎日のSEOチェックと報告
# Google の Lighthouse で主要ページを採点する。GitHub の無料枠で動き、Claude のクレジットは使わない。
# 毎日「毎日のレポート」を Issue として作り、GitHub からメールで届く（リポジトリを Watch → All Activity にしておく）。
# Secrets に LINE_CHANNEL_ACCESS_TOKEN と LINE_TO を登録すると LINE にも届く。
on:
  schedule:
    - cron: '43 23 * * *'   # 日本時間 毎朝 8:43（混雑時は遅れることがある）
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 300   # 直近1週間の変更をまとめるため履歴も取る
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 主要ページを採点
        run: |
          mkdir -p lh
          SITE=$(python3 -c "import re;print(re.search(r\"^DOMAIN = '([^']*)'\", open('site-src/build.py',encoding='utf-8').read(), re.M).group(1).rstrip('/'))")
          i=0
          for p in / /building /interior /restore /asbestos /area-ama /area-nagoya /column/; do
            i=$((i+1))
            npx -y lighthouse@12 "$SITE$p" --quiet --output=json --output-path="lh/$i.json" \
              --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=seo,performance,accessibility,best-practices || echo "失敗: $p"
          done
      - name: 結果をまとめて知らせる
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: python3 ops/lighthouse.py
